# CI backstop for the doc invariants (ADR-0003). The pre-commit hook is per-clone and
# skippable with --no-verify; this runs on every push and PR so a commit that dodged the
# hook still gets caught. Zero dependencies, so there is nothing to install.
name: docs

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # check-immutable compares two revisions, so the base must be in the clone
          # (ADR-0019). The default depth-1 checkout has no history to compare against.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Invariants (rules 1–8 fail the build; rule 9 warns).
      - run: node scripts/lint-docs.mjs .
      # The generated index must match the corpus — a stale INDEX.md fails here.
      - run: node scripts/build-index.mjs --check .
      # Immutable documents may only grow (ADR-0019). This is the backstop for the one
      # check a --no-verify commit is most tempting to dodge.
      - name: immutable documents only grow
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # A new branch reports an all-zero "before" and has no comparable base. Say so
          # rather than passing quietly — a skipped check that looks green is the failure
          # this project exists to prevent (ADR-0019).
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            node scripts/check-immutable.mjs "$BASE" HEAD
          else
            echo "::notice::no comparable base ref ($BASE) — immutability unchecked for this push"
          fi
      # The changelog is generated from tags, so a tagged release that was not regenerated
      # fails here rather than reaching a reader as a stale file (ADR-0026).
      - run: node scripts/build-changelog.mjs --check .
      # The invariant checks are themselves tested.
      - run: node --test test/*.test.mjs
